[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "image-colorization-claim-audit"
version = "0.1.0"
description = "Offline static documentation claim auditor"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
image-colorization-claim-audit = "image_colorization_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["image_colorization_claim_audit*"]
